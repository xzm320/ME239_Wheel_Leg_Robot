[project]
name = "high-speed-wheel-legged-robot"
version = "0.1.0"
description = "MuJoCo research platform for a high-speed wheel-legged robot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
