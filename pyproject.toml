[project]
name = "high-speed-wheel-legged-robot"
version = "0.1.0"
description = "MuJoCo ablation: rigid 2-link vs compliant 4-bar 3x-track wheel-legged machines on Perlin terrain"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.13.0",
    "numpy>=2.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
